name: Build OLTVI APKs

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app-usuario, app-conductor, app-jefe]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create local.properties
        working-directory: android
        run: |
          cat > local.properties <<EOF
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build ${{ matrix.app }} release APK
        working-directory: android
        run: ./gradlew :${{ matrix.app }}:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find android/${{ matrix.app }}/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK_PATH"

      - name: Upload ${{ matrix.app }} APK
        uses: actions/upload-artifact@v4
        with:
          name: oltvi-${{ matrix.app }}-${{ github.sha }}
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          tag_name: ${{ github.ref_name }}
          name: OLTVI ${{ github.ref_name }}
          body: |
            ## OLTVI ${{ github.ref_name }}

            APKs nativos Android para los 3 roles:
            - **OLTVI Usuario** — la app del pasajero
            - **OLTVI Trabajo** — la app del conductor
            - **OLTVI Mando** — la app del administrador

            Powered by Gemini AI agents + Google Maps 3D.
