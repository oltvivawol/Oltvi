name: Build OLTVI APKs

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app-usuario, app-conductor, app-jefe, app-neural]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create local.properties
        working-directory: android
        run: |
          printf 'sdk.dir=%s\nMAPS_API_KEY=%s\nGEMINI_API_KEY=%s\n' \
            "${ANDROID_SDK_ROOT}" \
            "${{ secrets.MAPS_API_KEY }}" \
            "${{ secrets.GEMINI_API_KEY }}" > local.properties

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build ${{ matrix.app }} debug APK
        working-directory: android
        run: ./gradlew :${{ matrix.app }}:assembleDebug --no-daemon --stacktrace
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find android/${{ matrix.app }}/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload ${{ matrix.app }} APK
        uses: actions/upload-artifact@v4
        with:
          name: oltvi-${{ matrix.app }}-${{ github.sha }}
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create local.properties
        working-directory: android
        run: |
          printf 'sdk.dir=%s\nMAPS_API_KEY=%s\nGEMINI_API_KEY=%s\n' \
            "${ANDROID_SDK_ROOT}" \
            "${{ secrets.MAPS_API_KEY }}" \
            "${{ secrets.GEMINI_API_KEY }}" > local.properties

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build all release APKs
        working-directory: android
        run: |
          ./gradlew \
            :app-usuario:assembleRelease \
            :app-conductor:assembleRelease \
            :app-jefe:assembleRelease \
            :app-neural:assembleRelease \
            --no-daemon
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          find android -path "*/apk/release/*.apk" -exec cp {} release-apks/ \;
          ls -lh release-apks/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          tag_name: ${{ github.ref_name }}
          name: OLTVI ${{ github.ref_name }}
          body: |
            ## OLTVI ${{ github.ref_name }}

            APKs nativos Android — 3 apps:
            - **OLTVI** (app-usuario) — pasajero
            - **OLTVI Conductor** (app-conductor) — driver
            - **OLTVI Mando** (app-jefe) — administrador
            - **Capa Neural** (app-neural) — plataforma urbana gamificada

            Powered by Gemini 2.0 Flash + Google Maps 3D.
