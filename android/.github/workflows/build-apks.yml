name: Build OLTVI Android APKs

on:
  push:
    branches: [ main, master, claude/oltvi-ai-agents-plan-XoQTk ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  create:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [ app-usuario, app-conductor, app-jefe ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Write local.properties
        working-directory: android
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Write google-services.json for ${{ matrix.app }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/${{ matrix.app }}/src/main
          echo "$GOOGLE_SERVICES_JSON" > android/${{ matrix.app }}/google-services.json
        if: env.GOOGLE_SERVICES_JSON != ''

      - name: Build Debug APK — ${{ matrix.app }}
        working-directory: android
        run: ./gradlew :${{ matrix.app }}:assembleDebug --no-daemon --stacktrace

      - name: Upload APK — ${{ matrix.app }}
        uses: actions/upload-artifact@v4
        with:
          name: oltvi-${{ matrix.app }}-debug
          path: android/${{ matrix.app }}/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Release APKs
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Write local.properties
        working-directory: android
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Build Release APKs
        working-directory: android
        run: |
          ./gradlew :app-usuario:assembleRelease --no-daemon
          ./gradlew :app-conductor:assembleRelease --no-daemon
          ./gradlew :app-jefe:assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app-usuario/build/outputs/apk/release/*.apk
            android/app-conductor/build/outputs/apk/release/*.apk
            android/app-jefe/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            ## OLTVI ${{ github.ref_name }}

            ### APKs incluidos
            - **OLTVI Usuario** — App del pasajero (mapa 3D + IA)
            - **OLTVI Conductor** — App del conductor (HUD + copiloto IA)
            - **OLTVI Jefe** — Panel de administración (analíticas IA)

            ### Configuración requerida
            - Google Maps API Key
            - Gemini API Key
            - google-services.json por app
